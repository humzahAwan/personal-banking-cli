# Default Categorization Rules for hledger Plain Text Accounting
# Copy to ~/.config/banking/rules.yaml to customize with personal rules.
#
# Format:
#   pattern: Case-insensitive regex matching merchant or description
#   account: Target hledger double-entry account

rules:
  # ==============================================================================
  # 1. INTERNAL & INTER-ACCOUNT TRANSFERS
  # ==============================================================================
  - pattern: "(?i)INTERNAL TRANSFER|FUNDS TRANSFER"
    account: "assets:transfers:internal"

  - pattern: "(?i)AMERICAN EXP|AMEX"
    account: "assets:transfers:amex"

  # ==============================================================================
  # 2. HOUSEHOLD BILLS, UTILITIES & FIXED HOUSING
  # ==============================================================================
  - pattern: "(?i)COUNCIL TAX"
    account: "expenses:tax:council"

  - pattern: "(?i)OCTOPUS ENERGY|BRITISH GAS|EDF|E\\.ON|OVO ENERGY|SO ENERGY|GOOD ENERGY"
    account: "expenses:utilities:energy"

  - pattern: "(?i)THAMES WATER|WESSEX WATER|SEVERN TRENT|YORKSHIRE WATER"
    account: "expenses:utilities:water"

  - pattern: "(?i)VIRGIN MEDIA|BT GROUP|SKY BROADBAND|PLUSNET|HYPEROPTIC"
    account: "expenses:utilities:internet"

  - pattern: "(?i)EE LIMITED|VODAFONE|O2|GIFFGAFF|THREE|TALKMOBILE|LEBARA"
    account: "expenses:telecom:mobile"

  - pattern: "(?i)HOME INSURANCE"
    account: "expenses:insurance:home"

  - pattern: "(?i)MORTGAGE|NATIONWIDE B S|HALIFAX|SANTANDER MORTGAGE"
    account: "expenses:housing:mortgage"

  - pattern: "(?i)CONVEYANCER|SOLICITORS"
    account: "expenses:housing:conveyancing"

  # ==============================================================================
  # 3. FINANCE, DEBT & REMITTANCE
  # ==============================================================================
  - pattern: "(?i)PERSONAL LOAN|RETAIL FINANCE|KLARNA"
    account: "expenses:finance:loans"

  - pattern: "(?i)INTEREST CHARGE|OVERDRAFT FEE"
    account: "expenses:finance:interest"

  - pattern: "(?i)WESTERN UNION|WISE|MONEYGRAM|REMITLY"
    account: "expenses:finance:remittance"

  # ==============================================================================
  # 4. GROCERIES, SUPERMARKETS & CONVENIENCE
  # ==============================================================================
  - pattern: "(?i)TESCO|SAINSBURY|ASDA|WAITROSE|ALDI|LIDL|MORRISONS|MARKS&SPENCER|M&S|SPAR|CO-OP|OCADO|ICELAND"
    account: "expenses:groceries"

  # ==============================================================================
  # 5. DINING, RESTAURANTS, CAFES & TAKEAWAYS
  # ==============================================================================
  - pattern: "(?i)DELIVEROO|UBER \\*EATS|JUST EAT|NANDOS|MCDONALDS|KFC|GREGGS|DOMINOS"
    account: "expenses:dining:takeaway"

  - pattern: "(?i)COSTA COFFEE|STARBUCKS|PRET A MANGER|CAFFE NERO|BAKERY|CAFE"
    account: "expenses:dining:cafes"

  # ==============================================================================
  # 6. PUBS, BARS & LEISURE
  # ==============================================================================
  - pattern: "(?i)WETHERSPOON|PUB|BAR|TAVERN|BREWERY|CINEMA|ODEON|VUE"
    account: "expenses:leisure:bars-pubs"

  # ==============================================================================
  # 7. TRANSPORT, DRIVING & TRAVEL
  # ==============================================================================
  - pattern: "(?i)TFL TRAVEL|TRAINLINE|GWR|NATIONAL RAIL|CROSSCOUNTRY|LNER|AVANTI"
    account: "expenses:transport:public"

  - pattern: "(?i)UBER   \\*TRIP|BOLT|FREE NOW"
    account: "expenses:transport:taxi"

  - pattern: "(?i)SHELL|BP |ESSO|TEXACO|PAY AT PUMP|PETROL"
    account: "expenses:transport:fuel"

  - pattern: "(?i)HALFORDS|DVLA|RINGO|PAYBYPHONE|PARKING|kwik fit"
    account: "expenses:transport:auto"

  - pattern: "(?i)AIRBNB|BOOKING\\.COM|PREMIER INN|TRAVELODGE|EASYJET|RYANAIR|BRITISH AIRWAYS|JET2"
    account: "expenses:travel:accommodation"

  # ==============================================================================
  # 8. HOME DIY, MAINTENANCE & FURNISHINGS
  # ==============================================================================
  - pattern: "(?i)B & Q|SCREWFIX|TOOLSTATION|WICKES|IKEA|THE RANGE|DUNELM|ARGOS"
    account: "expenses:home:diy"

  # ==============================================================================
  # 9. HEALTH, FITNESS & PERSONAL CARE
  # ==============================================================================
  - pattern: "(?i)PUREGYM|THE GYM|EVERYONE ACTIVE|LEISURE CENTRE|FITNESS"
    account: "expenses:fitness:sports"

  - pattern: "(?i)BOOTS|SUPERDRUG|NHS|PHARMACY"
    account: "expenses:health:pharmacy"

  - pattern: "(?i)DENTAL|OPTICIANS|SPECSAVERS|BUPA"
    account: "expenses:health:medical"

  # ==============================================================================
  # 10. PETS
  # ==============================================================================
  - pattern: "(?i)PETS AT HOME|VETS4PETS|VETSURE"
    account: "expenses:pets"

  # ==============================================================================
  # 11. HOBBIES, SHOPPING & TECH SUBSCRIPTIONS
  # ==============================================================================
  - pattern: "(?i)GOOGLE ONE|GOOGLE PLAY|APPLE\\.COM|PLAYSTATION|SPOTIFY|NETFLIX|DISNEY PLUS|AMAZON PRIME|SKY DIGITAL"
    account: "expenses:subscriptions:tech"

  - pattern: "(?i)AMAZON|EBAY|POST OFFICE|TKMAXX|WH SMITH|JOHN LEWIS|UNIQLO"
    account: "expenses:shopping:general"

  - pattern: "(?i)PAYPAL PAYMENT"
    account: "expenses:shopping:paypal"

  # ==============================================================================
  # 12. INCOME & INFLOWS
  # ==============================================================================
  - pattern: "(?i)SALARY|PAYROLL"
    account: "income:salary"

  - pattern: "(?i)GROSS INTEREST|INTEREST PAID"
    account: "income:interest"

  - pattern: "(?i)CASH IN P\\.O\\.|CASH DEPOSIT"
    account: "income:cash-deposit"
